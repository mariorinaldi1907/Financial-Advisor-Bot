services:
  web:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8501}:8501"
    environment:
      PORT: "8501"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
